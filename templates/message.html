{% extends 'base.html' %}

{% block content %}

<section class="section">

<div class="form-box">

    <h2>Contact Admin</h2>
    {% if success %}

<p style="color:green; font-weight:bold;">
    Message sent successfully!
</p>

{% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn">
            Send Message
        </button>

    </form>

</div>

</section>

{% endblock %}
